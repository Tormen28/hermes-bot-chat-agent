name: bot-chat-agent
label: Bot Chat Agent
kind: standalone
version: 0.3.0-dev
author: "Tormen28"
license: MIT
homepage: "https://github.com/Tormen28/hermes-bot-chat-agent"
description: >
  Makes a bot's canonical "Bot Chat" session (Bot Mode / hermes-bots) feel
  like a focused assistant: a short acknowledgement then the work, a
  configurable safety guard with presets (strict/default/relaxed) that blocks
  risky tool calls in Bot Chat and its subagent children (secrets, deletes,
  destructive git, pushes to protected branches, outbound messages, expensive
  models, kanban-lock bypasses), and a Desktop status bar (Working / Waiting
  for your OK / Waiting on a teammate / Done / Error) with reasoning collapsed
  by default. With team.gods empty it stays single-operator. When gods are
  configured it assigns kanban cards to those profiles and will not close
  them until the board shows done. Reads state.db and kanban.db read-only.
requires_hermes: ">=0.22.5"
manifest_version: 2
provides_tools: []
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - kanban_task_completed
hooks:
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - kanban_task_completed
tags: [bot-mode, bot-chat, safety, desktop, ux]
