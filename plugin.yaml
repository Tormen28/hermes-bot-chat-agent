name: bot-chat-agent
label: Hermes Bots
kind: standalone
version: 0.3.0
author: "Tormen28"
license: MIT
homepage: "https://github.com/Tormen28/hermes-bot-chat-agent"
description: >
  Makes a bot's canonical "Bot Chat" session (Bot Mode / hermes-bots) feel
  like a focused assistant: a short acknowledgement then the work, a
  configurable safety guard with presets (strict/default/relaxed) that blocks
  risky tool calls in Bot Chat and its subagent children (secrets, deletes,
  destructive git, pushes to protected branches, outbound messages, expensive
  models, kanban-lock bypasses), and a Desktop status bar (Working / Waiting
  for your OK / Waiting on a teammate / Done / Error) with reasoning collapsed
  by default. With team.assignees empty it stays single-operator (the default
  on a fresh install; an existing install that already lists teammates keeps
  the team on). When assignees are configured it assigns kanban cards to those
  profiles and will not close them until the board shows done. The old
  team.gods key still works; if both keys exist and differ the plugin blocks
  with an explanation instead of guessing. Also: pending-ask reminders after a
  mid-turn steer, local short-term / long-term memory (/memoria, no API keys),
  a live Desktop status card with delegations, and an opt-in panteón: with the
  Desktop half enabled, Hermes may OFFER (one line) to create a specialist bot
  and only creates it after your yes. Reads state.db and kanban.db read-only.
requires_hermes: ">=0.22.5"
manifest_version: 2
provides_tools: []
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - transform_tool_result
  - post_llm_call
  - agent_loop_stopped
  - kanban_task_completed
  - kanban_task_blocked
  - kanban_task_claimed
  - on_kanban_worker_spawned
hooks:
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - transform_tool_result
  - post_llm_call
  - agent_loop_stopped
  - kanban_task_completed
  - kanban_task_blocked
  - kanban_task_claimed
  - on_kanban_worker_spawned
tags: [bot-mode, bot-chat, safety, desktop, ux]
